<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Web</title>
  <style>
    /* Reset margin dan padding agar penuh 100% */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Mencegah double scrollbar */
      background-color: #ffffff;
    }
    
    /* Mengatur iframe agar menutupi seluruh layar */
    #gas-app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Link Google Apps Script Anda -->
  <iframe id="gas-app" src="https://script.google.com/macros/s/AKfycbydMNYy59sevsAI5pk0bTEOujEPa3Ldld16WLBxJw1ZyYQVPXQkh3PIStYXRiEhj1NQ/exec"></iframe>

</body>
</html>
