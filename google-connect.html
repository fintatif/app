        document.title = 'Masuk dengan Google - FINTATIF Smart Wealth';
        document.getElementById('ttl').textContent = 'Masuk dengan Google';
        document.getElementById('sub').textContent = 'Pilih akun Google yang emailnya sama dengan email terdaftar di FINTATIF Smart Wealth.';
        document.getElementById('lockText').textContent = 'FINTATIF hanya menerima nama dan alamat email dari akun Google-mu untuk proses masuk.';
        document.getElementById('ico-drive').innerHTML = document.querySelector('#go svg').outerHTML;
        btn.hidden = true;
        document.getElementById('gsiBtn').hidden = false;
      } else if (useCode && hint) {
        document.getElementById('sub').textContent = 'Pilih akun Google ' + hint + ', sama dengan email akun FINTATIF-mu. Cukup sekali di perangkat ini.';
      }

      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = function () {
        if (!isLogin) { btn.disabled = false; return; }
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: function (r) {
            if (r && r.credential) {
              send({ id_token: r.credential, mode: 'login' });
              msg('Berhasil. Jendela ini akan tertutup.', 'ok');
              setTimeout(function () { window.close(); }, 700);
            } else {
              msg('Login Google gagal. Coba lagi.', 'err');
            }
          },
          ux_mode: 'popup',
          auto_select: false
        });
        google.accounts.id.renderButton(document.getElementById('gsiBtn'), { type: 'standard', theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', logo_alignment: 'left', width: 300, locale: 'id' });
      };
      s.onerror = function () { msg('Layanan login Google gagal dimuat. Periksa koneksi lalu muat ulang.', 'err'); };
      document.head.appendChild(s);

      btn.addEventListener('click', function () {
        btn.disabled = true; msg('Membuka login Google...');
        if (useCode) {
          google.accounts.oauth2.initCodeClient({
            client_id: CLIENT_ID,
            scope: 'openid email ' + SCOPE,
            hint: hint || undefined,
            ux_mode: 'popup',
            callback: function (r) {
              if (r && r.code) {
                send({ code: r.code });
                msg('Tersambung. Jendela ini akan tertutup.', 'ok');
                setTimeout(function () { window.close(); }, 700);
              } else {
                send({ error: 'denied' });
                btn.disabled = false; msg('Izin Google tidak diberikan.', 'err');
              }
            },
            error_callback: function (e) {
              btn.disabled = false;
              msg(e && e.type === 'popup_closed' ? 'Jendela login ditutup. Coba lagi.' : 'Login Google gagal. Coba lagi.', 'err');
            }
          }).requestCode();
          return;
        }
        var client = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPE,
          callback: function (r) {
            if (r && r.access_token) {
              send({ access_token: r.access_token, expires_in: r.expires_in });
              msg('Tersambung. Jendela ini akan tertutup.', 'ok');
              setTimeout(function () { window.close(); }, 700);
            } else {
              send({ error: 'denied' });
              btn.disabled = false; msg('Izin Google tidak diberikan.', 'err');
            }
          },
          error_callback: function (e) {
            btn.disabled = false;
            msg(e && e.type === 'popup_closed' ? 'Jendela login ditutup. Coba lagi.' : 'Login Google gagal. Coba lagi.', 'err');
          }
        });
        client.requestAccessToken({ prompt: prompt });
      });
    })();
  </script>
</body>
