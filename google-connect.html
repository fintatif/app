  <style>

    .wrap { width: min(400px, 100%); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; }
    .brand img { width: auto; height: 46px; display: block; }

    .drive { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: rgb(16 185 129 / 12%); border: 1px solid rgb(52 211 153 / 25%); }
    .drive svg { width: 28px; height: 28px; }

      border-radius: 14px; border: 1px solid rgb(52 211 153 / 22%); background: rgb(16 185 129 / 9%); color: #a7f3d0; font-size: 13px; font-weight: 600; line-height: 1.55;
    }
    .lock svg { flex: none; width: 17px; height: 17px; margin-top: 1px; color: #34d399; }
    .gbtn {
      display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-top: 22px; min-height: 50px; padding: 0 18px;
      border: 0; border-radius: 14px; background: #fff; color: #1f1f1f; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: transform .15s, box-shadow .2s, opacity .2s; box-shadow: 0 10px 24px -12px rgb(0 0 0 / 60%);
    }
    .gbtn:hover { box-shadow: 0 0 0 4px rgb(52 211 153 / 22%), 0 10px 24px -12px rgb(0 0 0 / 60%); }
    .gbtn:active { transform: scale(.98); }
    .gbtn[disabled] { opacity: .55; cursor: default; box-shadow: none; }
    .gbtn svg { width: 20px; height: 20px; flex: none; }
    .gsi { display: flex; justify-content: center; margin-top: 22px; min-height: 44px; }
    [hidden] { display: none !important; }
    #msg { min-height: 22px; margin-top: 14px; font-weight: 600; font-size: 13.5px; color: #94a3b8; }
    #msg.ok { color: #34d399; }
    #msg.err { color: #fda4af; }
    .foot { margin-top: 18px; text-align: center; color: #64748b; font-size: 12px; }
    .foot a { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMsAAAB4CAYAAABcpQboAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAB1SURBVHhe7cGBAAAAAMOg+VMf4QJVAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMA3fScAAVR2wZMAAAAASUVORK5CYII=" alt="">
      <span><b>FINTATIF</b><small>SMART WEALTH</small></span>

    <main class="card">
      <span class="drive" id="ico-drive" aria-hidden="true">
        <svg viewBox="0 0 87.3 78"><path fill="#0066da" d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z"/><path fill="#00ac47" d="M43.65 25 29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3L1.2 48.5A9.06 9.06 0 0 0 0 53h27.5z"/><path fill="#ea4335" d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z"/><path fill="#00832d" d="M43.65 25 57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z"/><path fill="#2684fc" d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z"/><path fill="#ffba00" d="M73.4 26.5 60.7 4.5c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 53h27.45c0-1.55-.4-3.1-1.2-4.5z"/></svg>

        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>

  <script>
    (function () {
      'use strict';
      var CLIENT_ID = '304891749309-caju51666hma60mo014mh9aeaj4cs6no.apps.googleusercontent.com';
      var SCOPE = 'https://www.googleapis.com/auth/drive.file';
      // Hanya jendela Apps Script FINTATIF Smart Wealth yang boleh menerima token.
      var APP_ORIGIN = 'https://n-pniqculxqumsxzxy5lxyjukrqvkwztfracnnyhi-0lu-script.googleusercontent.com';

      var params = new URLSearchParams(location.search);
      var state = params.get('state') || '';
      var prompt = params.get('prompt') || '';
      // mode=login: masuk/daftar dengan akun Google (ID token). Tanpa mode: izin Google Drive (access token).
      var isLogin = params.get('mode') === 'login';
      var btn = document.getElementById('go'), msgEl = document.getElementById('msg');

      function msg(text, cls) { msgEl.textContent = text; msgEl.className = cls || ''; }
      function send(data) {
        if (!window.opener) return false;
        data.type = 'fintatif-gdrive'; data.state = state;
        window.opener.postMessage(data, APP_ORIGIN);
        return true;
      }

      if (!window.opener || !state) {
        msg('Buka halaman ini dari tombol "Hubungkan Google" di FINTATIF Smart Wealth.', 'err');
        return;
      }

      if (isLogin) {
        document.title = 'Masuk dengan Google - FINTATIF Smart Wealth';
        document.getElementById('ttl').textContent = 'Masuk dengan Google';
        document.getElementById('sub').textContent = 'Pilih akun Google yang emailnya sama dengan email terdaftar di FINTATIF Smart Wealth.';
        document.getElementById('lockText').textContent = 'FINTATIF hanya menerima nama dan alamat email dari akun Google-mu untuk proses masuk.';
        document.getElementById('ico-drive').innerHTML = document.querySelector('#go svg').outerHTML;
        btn.hidden = true;
        document.getElementById('gsiBtn').hidden = false;
      }

      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = function () {
        if (!isLogin) { btn.disabled = false; return; }
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: function (r) {
            if (r && r.credential) {
              send({ id_token: r.credential, mode: 'login' });
              msg('Berhasil. Jendela ini akan tertutup.', 'ok');
              setTimeout(function () { window.close(); }, 700);
            } else {
              msg('Login Google gagal. Coba lagi.', 'err');
            }
          },
          ux_mode: 'popup',
          auto_select: false
        });
        google.accounts.id.renderButton(document.getElementById('gsiBtn'), { type: 'standard', theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', logo_alignment: 'left', width: 300, locale: 'id' });
      };
      s.onerror = function () { msg('Layanan login Google gagal dimuat. Periksa koneksi lalu muat ulang.', 'err'); };
      document.head.appendChild(s);

      btn.addEventListener('click', function () {
        btn.disabled = true; msg('Membuka login Google...');
        var client = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPE,
          callback: function (r) {
            if (r && r.access_token) {
              send({ access_token: r.access_token, expires_in: r.expires_in });
              msg('Tersambung. Jendela ini akan tertutup.', 'ok');
              setTimeout(function () { window.close(); }, 700);
            } else {
              send({ error: 'denied' });
              btn.disabled = false; msg('Izin Google tidak diberikan.', 'err');
            }
          },
          error_callback: function (e) {
            btn.disabled = false;
            msg(e && e.type === 'popup_closed' ? 'Jendela login ditutup. Coba lagi.' : 'Login Google gagal. Coba lagi.', 'err');
          }
        });
        client.requestAccessToken({ prompt: prompt });
      });
    })();
  </script>
